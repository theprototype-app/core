<!doctype html>
<!-- class="dark": the app is a dark-theme tool (tailwind darkMode:'class');
     every component's dark: styles were authored for this -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- 15-N: installable as a PWA. `standalone` drops the browser chrome,
		     which matters most on a phone where viewport height is the scarce
		     resource. iOS ignores the manifest for that, hence the apple-* trio. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#111827" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="theprototype" />
		<script>
			// apply the saved theme before first paint (themes.js takes over after)
			try {
				var savedTheme = localStorage.getItem('theme');
				if (savedTheme) {
					document.documentElement.dataset.theme = savedTheme;
					if (savedTheme === 'light') document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="overflow-x-hidden overflow-y-hidden bg-gray-900" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
