# Dependency update policy (release 1.0):
# - one grouped PR per month for all minor/patch bumps (low-risk, reviewed together)
# - majors arrive as separate PRs, EXCEPT the known frozen migration deps below —
#   each of those needs its own planned migration (see plans-core/pending/ in the
#   private cloud repo) and a Dependabot PR would just red-x until then.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # engine: TS 7 until svelte-check peers it (currently ^5||^6)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # physics solver behavior can shift on 0.x bumps (rapier revolute-axis gotcha)
      - dependency-name: '@dimforge/rapier3d-compat'
      # 2026-08-01: three/threlte/xyflow/flowbite/tailwind/vite ignores REMOVED -
      # the planned migrations (A-D) all shipped; future majors PR normally.
