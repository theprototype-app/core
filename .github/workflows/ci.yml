# 27-I (hardening audit H5) — CI ON PULL REQUESTS.
#
# Until now the only workflow was release.yml, which runs on a v* TAG. So CONTRIBUTING's
# rule ("npm run build should pass and npm run check should not add new errors") was
# enforced by whoever remembered to run it, and a broken main was discovered at release
# time. Everything below is what a maintainer already does by hand.
#
# e2e-smoke GATES since test-health-1 (feat/60). It renders WebGL through SwiftShader on a
# GPU-less runner (~4.5 fps), so it was report-only until it had been seen green on GitHub:
# the runner step now really fails (it used to `|| echo` every red away), a failed suite runs
# once more (green on the retry = flaky, reported), and a known flake is entered in
# tests/e2e/quarantine.json with an owner and a review date instead of blocking every PR.
#
# Two-peer suites stay a MANUAL gate: they meet on the self-hosted signaling box, which a
# public runner cannot reach and should not be pointed at.
#
# deps-auto: PRs into the `deps` branch (Dependabot's version updates) run this file through
# deps.yml (workflow_call) as part of the dependency gate, so it does not ALSO run for them here.
name: ci
on:
  pull_request:
    branches-ignore: [deps]
  push:
    branches: [main, release/next]
  workflow_call:
    inputs:
      # deps.yml: the e2e battery runs these suites itself, so the two browser jobs below stand down
      battery:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # 45 D2: ONE toolchain. .nvmrc (read above), .mise.toml and package.json's
      # packageManager + devEngines pin the same Node and npm. Locally a mismatch only
      # warns (devEngines onFail: warn); here it fails, so a half-done bump cannot land.
      - name: toolchain pins agree
        run: |
          node_pin=$(cat .nvmrc)
          npm_pin=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
          fail() { echo "::error::$1"; exit 1; }
          grep -qx "node = \"$node_pin\"" .mise.toml || fail ".mise.toml node is not $node_pin (.nvmrc)"
          [ "$(node -p "require('./package.json').devEngines.runtime.version")" = "$node_pin" ] || fail "devEngines.runtime is not $node_pin (.nvmrc)"
          [ "$(node -p "require('./package.json').devEngines.packageManager.version")" = "$npm_pin" ] || fail "devEngines.packageManager is not $npm_pin (packageManager)"
          [ "$(node -v)" = "v$node_pin" ] || fail "runner node $(node -v), pinned $node_pin"
          [ "$(npm -v)" = "$npm_pin" ] || fail "runner npm $(npm -v), pinned $npm_pin — Node $node_pin bundles a different npm; bump packageManager + devEngines with it"
      - run: npm ci
      - run: npm run build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ONE source of truth for the baseline: check-baseline.json, read by the same
      # script release.yml uses. The number used to live in a shell block here and went
      # stale by three.
      - name: svelte-check baseline gate
        run: node scripts/check-ratchet.cjs
      # 27-H (audit M4): 507 bare `localStorage` calls were routed through
      # $lib/safeStorage in one pass. Without a gate that codemod decays on the next
      # feature, because the file you are editing still shows you ninety-three examples
      # of the old way. `setItem` throws in Safari private mode and on a full quota, and
      # most of these sit inside $effects and store subscribers, where the throw kills
      # the subscriber for the session.
      - name: no bare localStorage
        run: node scripts/check-storage.cjs
      # 38 R2/R11: colours come from the redesign tokens — a HARD FAIL since R11 (every
      # component was migrated). A colour that is data, not chrome, carries
      # `tokens-ok: <reason>` on its line; scripts/check-tokens.cjs says how.
      - name: redesign tokens
        run: node scripts/check-tokens.cjs
      # 41 G3b: ONE z-index scale (src/styles/ui.css). A page-level literal z-index fails;
      # `z-ok: <reason>` on its line for a number code reads back.
      - name: z-index scale
        run: node scripts/check-zindex.cjs

  # 34 B3: scene-lint over every scene core ships (the seed) and every scene of the scenes ref
  # the perf budget is about (perf/budgets.json), with the packs checkout for the kit rules.
  # Static, no browser: seconds. Errors fail; warnings print.
  scene-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: the scenes ref (perf/budgets.json)
        id: refs
        run: |
          echo "scenes=$(node -p "require('./perf/budgets.json').scenes.ref")" >> "$GITHUB_OUTPUT"
          echo "scenes_repo=$(node -p "require('./perf/budgets.json').scenes.repo")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.scenes_repo }}
          ref: ${{ steps.refs.outputs.scenes }}
          path: .perf-deps/scenes
      - uses: actions/checkout@v7
        with:
          repository: theprototype-app/packs
          path: .perf-deps/packs
      - name: scene-lint
        run: node scripts/scene-lint.cjs static/templates .perf-deps/scenes --packs .perf-deps/packs

  # 45 D3: what the repo depends on, and whether any of it is known-bad. syft writes an SPDX
  # SBOM of both lockfiles (root + tools/agent, dev dependencies included — .syft.yaml says
  # why) and grype FAILS the job on any critical or high finding. Accepted findings go in
  # .grype.yaml, one rule per advisory with a reason; RELEASING.md has the ritual. No npm ci:
  # the lockfiles are the whole input, so this runs in seconds.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: vulnerability gate (grype, fails on critical/high)
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: sbom.spdx.json
          config: .grype.yaml
          severity-cutoff: high
          fail-build: true
          output-format: table
          only-fixed: false

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e-smoke:
    if: ${{ !inputs.battery }}
    runs-on: ubuntu-latest
    # a gate — see the header (green on GitHub for bc453ae8 and e77ca3f7 before the flip)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # WebXR and getUserMedia need HTTPS, so the dev server serves TLS from certs/ —
      # gitignored, generated per clone.
      - run: npm run certs
      - name: start the dev server
        run: |
          npm run dev -- --port 5173 --strictPort --host localhost > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sk -o /dev/null https://localhost:5173/ && break
            sleep 1
          done
          curl -sk -o /dev/null -w 'dev server: %{http_code}\n' https://localhost:5173/
      - name: single-peer suites
        env:
          APP_URL: https://localhost:5173/
        run: |
          # 27-D/27-E/27-G added three more SINGLE-PEER suites, so they belong here.
          # Deliberately NOT added: net-stress and signaling-reconnect are multi-peer and
          # meet on the self-hosted signaling box, which a public runner cannot reach and
          # should not be pointed at (see the header) — they stay a manual gate.
          # test-health-1: through the battery runner, so a red is a red (the old loop's
          # `|| echo SUITE FAILED` could never fail the step), a failed suite runs once more
          # (green on the retry = flaky, reported) and tests/e2e/quarantine.json applies.
          node scripts/ci/battery.cjs run --only net-backoff,net-mesh,wire-hardening,runtime-resilience,diagnostics,mesh-budget,script-guard,dispose,approval-timeout --port 5173 --out /tmp/smoke
      - name: dev server log on failure
        if: failure()
        run: tail -40 /tmp/dev.log
      - name: suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-logs
          path: /tmp/smoke/logs
          if-no-files-found: ignore

  # 53-reader (A4): THE ACCESSIBILITY GATE. axe-core over the main surfaces (editor shell, object
  # list, Inspector, Settings, Asset Browser on recorded fixtures, phone shell) FAILS on serious and
  # critical violations; moderate and minor are listed in the uploaded report, not fixed. Plus the
  # screen-reader basics (live regions, selection announce, the object-list tree). One page at a
  # time and DOM-only assertions, so — unlike e2e-smoke — it gates.
  a11y:
    if: ${{ !inputs.battery }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run certs
      - name: start the dev server
        run: |
          npm run dev -- --port 5173 --strictPort --host localhost > /tmp/dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sk -o /dev/null https://localhost:5173/ && break
            sleep 1
          done
          curl -sk -o /dev/null -w 'dev server: %{http_code}\n' https://localhost:5173/
      - name: axe gate + screen-reader basics
        env:
          APP_URL: https://localhost:5173/
          AXE_REPORT_DIR: /tmp/axe
        run: |
          rc=0
          npm run e2e -- a11y-axe a11y-reader || rc=$?
          [ -f /tmp/axe/axe-after.md ] && cat /tmp/axe/axe-after.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: axe-report
          path: /tmp/axe
      - name: dev server log on failure
        if: failure()
        run: tail -40 /tmp/dev.log
      - name: suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-logs
          path: /tmp/smoke/logs
          if-no-files-found: ignore

  # 38 (NOTES-38 #18): THE TOKEN SCREENSHOT DIFF. /kit renders every redesign primitive in every
  # state; this job shoots it in the dark, light and custom themes on the PR's BASE ref and on its
  # HEAD, on this same runner (so fonts and anti-aliasing cannot drift between machines), and diffs
  # them (tests/e2e/tools/kit-diff.cjs). It FAILS when a theme moved more than 0.01% of the kit's
  # pixels — a signal to look at the diff images in the artifact, not a required check: a PR that
  # changes a token on purpose turns it red and says so. A base without /kit is skipped.
  kit-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run certs
      - name: base checkout
        id: base
        run: |
          git worktree add ../kit-base "origin/${{ github.base_ref }}"
          if [ -f ../kit-base/src/routes/kit/+page.svelte ]; then
            echo "has_kit=1" >> "$GITHUB_OUTPUT"
            cp -r certs ../kit-base/ && (cd ../kit-base && npm ci)
          else
            echo "has_kit=0" >> "$GITHUB_OUTPUT"
            echo "The base branch has no /kit yet — nothing to diff against." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: shoot base and head
        if: steps.base.outputs.has_kit == '1'
        run: |
          serve() { (cd "$1" && npm run dev -- --port "$2" --strictPort --host localhost > "/tmp/dev-$2.log" 2>&1 &)
            for i in $(seq 1 90); do curl -sk -o /dev/null "https://localhost:$2/kit" && break; sleep 1; done; }
          serve ../kit-base 5174
          serve . 5173
          node tests/e2e/tools/kit-diff.cjs shoot https://localhost:5174/ /tmp/kit/base
          node tests/e2e/tools/kit-diff.cjs shoot https://localhost:5173/ /tmp/kit/head
      - name: diff
        if: steps.base.outputs.has_kit == '1'
        run: |
          node tests/e2e/tools/kit-diff.cjs diff /tmp/kit/base /tmp/kit/head /tmp/kit/diff; rc=$?
          cat /tmp/kit/diff/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always() && steps.base.outputs.has_kit == '1'
        with:
          name: kit-diff
          path: /tmp/kit
