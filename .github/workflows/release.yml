# V6 (versioning): tag-triggered release — push a v* tag (via `npm version` +
# `git push --follow-tags`, see RELEASING.md) and this builds the static app,
# gates on the svelte-check baseline, and publishes a GitHub Release with the
# build zip + generated notes.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # svelte-check exits non-zero at the legacy baseline; fail ONLY when the
      # counts grow past it (baseline 391 errors / 62 warnings, 2026-08-10 — 435 ->
      # 421 #15 C's one-way pickers -> 419 K's outline rework -> 417 B5's fixes ->
      # 391 when 17-A moved piano/avatar/essentials/car out to the modules repo ->
      # 388 when #20 annotated Scene's marqueeStart, which was three implicit-anys)
      # -> 387 when 21-D retired the HUD datalist plumbing, taking one with it)
      # -> 386 with the per-camera looks round, -> 385 when 21-E consolidated
      # PointerLockControls' camera swap into one effect
      # -> 384/47 with the controls/dock rework: warnings 62 -> 47 when the six
      # hand-written pill cells became one {#each} template, errors -1 net from the
      # applyLook fold in PointerLockControls)
      # 27-I: ONE source of truth. The counts used to be hardcoded in this block and went
      # stale (362 here while the tree measured 359); check-baseline.json is the floor now
      # and ci.yml's gate runs the very same script.
      - name: svelte-check baseline gate
        run: node scripts/check-ratchet.cjs

      - name: zip the build
        run: cd build && zip -r "../theprototype-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: theprototype-*.zip
