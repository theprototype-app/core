# V6 (versioning): tag-triggered release — push a v* tag (via `npm version` +
# `git push --follow-tags`, see RELEASING.md) and this builds the static app,
# gates on the svelte-check baseline, and publishes a GitHub Release with the
# build zip + generated notes.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # svelte-check exits non-zero at the legacy baseline; fail ONLY when the
      # counts grow past it (baseline 421 errors / 62 warnings, 2026-08-01 — the
      # roadmap #15 C one-way `hex` picker rework dropped it from 435, node 24)
      - name: svelte-check baseline gate
        run: |
          npm run check 2>&1 | tee check.log || true
          # svelte-check prints "N ERRORS N WARNINGS" (machine) or
          # "found N errors and N warnings" (human) depending on the TTY — parse both
          LINE=$(grep -Eo '[0-9]+ ERRORS [0-9]+ WARNINGS' check.log | tail -1)
          ERRORS=$(echo "$LINE" | awk '{print $1}')
          WARNINGS=$(echo "$LINE" | awk '{print $3}')
          if [ -z "$ERRORS" ]; then
            LINE=$(grep -Eo 'found [0-9]+ errors and [0-9]+ warnings' check.log | tail -1)
            ERRORS=$(echo "$LINE" | awk '{print $2}')
            WARNINGS=$(echo "$LINE" | awk '{print $5}')
          fi
          echo "svelte-check: $ERRORS errors / $WARNINGS warnings (baseline 421/62)"
          if [ -z "$ERRORS" ]; then echo "could not parse svelte-check output"; exit 1; fi
          if [ "$ERRORS" -gt 421 ] || [ "$WARNINGS" -gt 62 ]; then
            echo "baseline exceeded"; exit 1
          fi
      - name: zip the build
        run: cd build && zip -r "../theprototype-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: theprototype-*.zip
