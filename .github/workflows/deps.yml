# deps-auto — DEPENDENCY UPDATES, TESTED AND MERGED WITHOUT A PERSON IN THE LOOP.
#
# Dependabot opens its version updates against the long-lived `deps` branch (.github/dependabot.yml,
# target-branch). Every PR into `deps` runs the whole release gate here: ci.yml (build, the
# svelte-check ratchet, vitest, scene-lint, kit-diff, a11y, supply chain) and perf-budget.yml, both
# called as reusable workflows, then the integrators' e2e battery split into shards on
# GitHub-hosted runners (SwiftShader: no GPU, battery.yml): the REQUIRED set gates; the OPTIONAL set (red on
# SwiftShader with unchanged code, each with its reason in tests/e2e/battery.json) runs only when started by hand
# (workflow_dispatch) and is only reported. Perf budget + battery run only for a non-major change to the root
# app's npm packages (deps-policy.cjs `battery`): Actions, the agent and majors get ci.yml alone, so one monthly
# Dependabot round does not hold the account's 20 concurrent jobs for half a day. `deps-gate` is the one
# required check; the ruleset on
# `deps` also requires the `pc-battery` commit status, which the GPU check on a desktop posts for a
# PR that changes what the app ships (scripts/ci/pc-battery.sh — pulled from there, no runner of ours
# in this public repo) and this workflow posts as "not needed" for every other PR.
#
# Then the policy (scripts/ci/deps-policy.cjs): patch / development-only / actions → GitHub
# auto-merge; a minor of something that ships → label `deps-ready` for the monthly deps lane; a
# major → `needs-migration` with a pointer to the planned migrations. Integrators merge `deps` into
# their union branch; RELEASING.md "Dependency updates" has the whole loop.
#
# Security updates are the exception GitHub makes: they always target the default branch, whatever
# target-branch says. They get the same battery and labels here (pull_request into main by
# Dependabot), never auto-merge (main has no required checks to wait for), and a person merges.
name: deps

on:
  pull_request:
    branches: [deps, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # what this PR is and what happens to it once it is green
  scope:
    runs-on: ubuntu-latest
    # into main: Dependabot's security updates only — every other PR to main has ci.yml already
    if: github.event_name != 'pull_request' || github.base_ref == 'deps' || github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      cls: ${{ steps.policy.outputs.class }}
      needs_pc: ${{ steps.policy.outputs.needs_pc }}
      reason: ${{ steps.policy.outputs.reason }}
      battery: ${{ steps.policy.outputs.battery }}
      gate_ci: ${{ github.event_name != 'pull_request' || github.base_ref == 'deps' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
      - name: policy
        id: policy
        env:
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$DEPS_JSON" ]; then
            node scripts/ci/deps-policy.cjs
          else
            # a person's PR (or a dispatch): no automation; the PC check runs when the app's lockfile moved
            pc=false
            if [ -n "$BASE" ] && git diff --name-only "origin/$BASE...HEAD" | grep -qxE 'package(-lock)?\.json'; then pc=true; fi
            printf 'class=manual\nneeds_pc=%s\nbattery=true\nreason=not a Dependabot PR\n' "$pc" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: majors wait for a planned migration
        if: steps.policy.outputs.class == 'major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-migration --color B60205 --description 'Major update: needs a planned migration' 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-migration
          gh pr comment "$PR" --body "A major update is not merged by automation. It needs a planned migration (the maintainers keep those notes beside the roadmap, under plans/core/pending/ in the private planning repo); until then this PR stays open and labelled \`needs-migration\`. If the migration is already written, link it here."

  ci:
    needs: scope
    if: needs.scope.outputs.gate_ci == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      battery: true

  # the budget gate in three parallel parts (~20 min each instead of ~60 in one)
  perf:
    needs: scope
    if: needs.scope.outputs.gate_ci == 'true' && needs.scope.outputs.battery == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    uses: ./.github/workflows/perf-budget.yml
    with:
      part: ${{ matrix.part }}
      parts: 3

  plan:
    needs: scope
    if: needs.scope.outputs.battery == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      optional_matrix: ${{ steps.plan.outputs.optional_matrix }}
      optional_shards: ${{ steps.plan.outputs.optional_shards }}
      playwright: ${{ steps.pw.outputs.version }}
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: node scripts/ci/battery.cjs plan
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: refs
        run: echo "refs=$(node -p "JSON.stringify(require('./tests/e2e/battery.json').refs)")" >> "$GITHUB_OUTPUT"

  # the suites that gate (sized by battery.json to finish inside the hour)
  e2e:
    needs: plan
    uses: ./.github/workflows/battery.yml
    with:
      set: required
      matrix: ${{ needs.plan.outputs.matrix }}
      playwright: ${{ needs.plan.outputs.playwright }}
      refs: ${{ needs.plan.outputs.refs }}
      deadline: 75

  # SwiftShader makes any one suite fail now and then, twice on one loaded runner too: a required red (or a suite
  # the deadline left unrun) gets two more tries on a FRESH runner before it counts
  confirm:
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    uses: ./.github/workflows/battery.yml
    with:
      set: confirm
      matrix: '{"include":[{"shard":1,"of":3,"suites":0,"est":0},{"shard":2,"of":3,"suites":0,"est":0},{"shard":3,"of":3,"suites":0,"est":0}]}'
      playwright: ${{ needs.plan.outputs.playwright }}
      refs: ${{ needs.plan.outputs.refs }}
      deadline: 20

  # red or flaky on SwiftShader with the same red on unchanged code: reported, never waited for, and only on a run
  # started by hand (refreshing battery.json's classification); ~750 runner-min a time is too much for every PR.
  # They start AFTER the required shards and the confirm step (the free plan runs 20 jobs at once).
  e2e-optional:
    needs: [plan, e2e, confirm]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.plan.result == 'success' && needs.plan.outputs.optional_shards != '0' }}
    uses: ./.github/workflows/battery.yml
    with:
      set: optional
      matrix: ${{ needs.plan.outputs.optional_matrix }}
      playwright: ${{ needs.plan.outputs.playwright }}
      refs: ${{ needs.plan.outputs.refs }}
      deadline: 40

  optional-report:
    needs: e2e-optional
    if: ${{ !cancelled() && needs.e2e-optional.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: battery-optional-*
          path: battery
      - name: optional suites (report only)
        run: node scripts/ci/battery.cjs report battery || true

  # THE required check (the ruleset on `deps` names it)
  gate:
    name: deps-gate
    needs: [scope, ci, perf, plan, e2e, confirm]
    if: ${{ !cancelled() && needs.scope.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.battery == 'true'
        with:
          pattern: battery-required-*
          path: battery
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.battery == 'true' && needs.confirm.result != 'skipped'
        with:
          pattern: battery-confirm-*
          path: battery
      - name: battery report
        id: report
        if: needs.scope.outputs.battery == 'true'
        run: node scripts/ci/battery.cjs report battery
      - name: the release gate
        env:
          GATE_CI: ${{ needs.scope.outputs.gate_ci }}
          BATTERY: ${{ needs.scope.outputs.battery }}
          CLS: ${{ needs.scope.outputs.cls }}
          CI: ${{ needs.ci.result }}
          PERF: ${{ needs.perf.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "### Release gate: ci=$CI perf-budget=$PERF battery=$BATTERY (class $CLS: ${{ needs.scope.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CLS" = major ]; then
            echo "A major is not tested here (no perf budget, no battery): its planned migration runs them. Red on purpose." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$BATTERY" = true ] && [ "$E2E" = skipped ]; then exit 1; fi
          if [ "$GATE_CI" = true ] && { [ "$CI" != success ] || { [ "$BATTERY" = true ] && [ "$PERF" != success ]; }; }; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: battery-durations
          path: battery/durations.json
          if-no-files-found: ignore
      # green from here on
      - name: pc-battery not needed
        if: github.event_name == 'pull_request' && needs.scope.outputs.needs_pc != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" -f state=success -f context=pc-battery \
            -f description='Not needed: nothing the app ships changed' > /dev/null
      - name: ready for the monthly deps lane
        if: needs.scope.outputs.cls == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deps-ready --color 0E8A16 --description 'Green; a runtime minor or a Playwright bump waiting for the deps lane' 2>/dev/null || true
          gh pr edit "${{ github.event.pull_request.number }}" --add-label deps-ready

  # its own job: turning auto-merge on needs contents: write, which the gate (it checks out and runs the PR's
  # code) should not hold. No checkout here; it only runs after a green deps-gate.
  automerge:
    needs: [scope, gate]
    if: needs.scope.outputs.cls == 'auto' && github.base_ref == 'deps'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # waits for whatever the ruleset still wants (pc-battery from the desktop for a runtime patch)
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash
