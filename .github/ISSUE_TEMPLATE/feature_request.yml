name: ✨ Feature request
description: Suggest something the app should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The goal, not the solution — it often has a simpler answer than expected.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Modelling / editing
        - Node editor (flow)
        - Physics
        - VR
        - Collaboration / networking
        - Assets, packs, files
        - AI assistant / generation
        - Modules & SDK
        - UI / UX
        - Something else
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, references from other tools, or a module that could do it instead.
